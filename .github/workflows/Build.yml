name: Android14 GKI Kernel 6.1.163 with DroidSpaces

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android14-6.1

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out
      DEFCONFIG: gki_defconfig
      LLVM_VERSION: 22.1.2
      LLVM_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.2/clang+llvm-22.1.2-x86_64-linux-gnu-ubuntu-18.04.tar.xz

    steps:
      # Bersihkan workspace sebelum clone (opsional)
      - name: Clean workspace
        run: |
          sudo rm -rf ${{ github.workspace }}/*
          sudo rm -rf ${{ github.workspace }}/.[!.]*
        continue-on-error: true

      # ====== CLONE MANUAL ======
      - name: Clone kernel source manually
        run: |
          # Tentukan branch yang akan di-clone
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            # Untuk workflow_dispatch, gunakan branch default (sesuaikan dengan kebutuhan)
            BRANCH="lineage-23.2"
          fi
          echo "Cloning branch: $BRANCH"
          git clone --depth=1 --branch "$BRANCH" https://github.com/Antaru74/android_kernel_xiaomi_sm8635.git .
          git submodule update --init --recursive --depth=1
        timeout-minutes: 30   # Waktu maksimal clone 30 menit

      # ====== CLEANUP ======
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /usr/lib/jvm
          sudo apt clean

      # ====== INSTALL DEPENDENCIES ======
      - name: Install build dependencies (Ubuntu)
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git libelf-dev libssl-dev \
            lld python3 unzip zip device-tree-compiler lz4 xz-utils zlib1g-dev \
            openjdk-17-jdk gcc g++ python-is-python3 p7zip-full \
            android-sdk-libsparse-utils erofs-utils gnupg gperf \
            libncurses-dev libx11-dev libreadline-dev libgl1-mesa-dev \
            make repo cpio kmod openssl libarchive-tools zstd rsync dwarves

      # ====== TOOLCHAIN: LLVM 22.1.2 ======
      - name: Setup LLVM ${{ env.LLVM_VERSION }}
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          curl -L -o llvm.tar.xz "${{ env.LLVM_URL }}"
          tar -xf llvm.tar.xz
          rm llvm.tar.xz
          LLVM_DIR=$(ls -d clang+llvm-* | head -n1)
          echo "LLVM_PATH=$HOME/toolchains/$LLVM_DIR/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/toolchains/$LLVM_DIR/bin:$PATH" >> $GITHUB_ENV

      - name: Set cross-compile environment
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "READELF=llvm-readelf" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # ====== PATCH ======
      - name: Apply DroidSpaces kernel patch (sysvipc kabi fix)
        run: |
          curl -L -o fix_sysvipc.patch \
            "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          patch -p1 < fix_sysvipc.patch

      # ====== KERNEL CONFIGURATION ======
      - name: Generate defconfig + merge vendor configs
        run: |
          mkdir -p ${{ env.OUT_DIR }}
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}

          # (Opsional) merge vendor config jika ada
          if [ -f arch/arm64/configs/vendor/pineapple_GKI.config ]; then
            scripts/kconfig/merge_config.sh -m ${{ env.OUT_DIR }}/.config \
              arch/arm64/configs/vendor/pineapple_GKI.config
          fi

          # Tambahkan konfigurasi DroidSpaces
          cat << EOF >> ${{ env.OUT_DIR }}/.config
          # DroidSpaces support
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          EOF

          # Resolve dependensi
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} olddefconfig

      # ====== BUILD KERNEL ======
      - name: Build kernel
        id: build
        run: |
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} -j$(nproc) \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ $exit_code -ne 0 ]; then
            echo "Build failed with exit code $exit_code"
            tail -100 build.log > error.txt
          fi
        continue-on-error: true

      # ====== UPLOAD ERROR LOGS ======
      - name: Upload error logs on failure
        if: steps.build.outputs.exit_code != 0
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-error
          path: |
            build.log
            error.txt
            ${{ env.OUT_DIR }}/.config

      # ====== COLLECT ARTIFACTS ======
      - name: Collect artifacts
        if: steps.build.outputs.exit_code == 0
        run: |
          mkdir -p artifacts
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image artifacts/ || true
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image.lz4 artifacts/ || true
          cp ${{ env.OUT_DIR }}/drivers/regulator/rpmh-regulator.ko artifacts/ || true
          cp ${{ env.OUT_DIR }}/drivers/power/supply/qti_battery_charger.ko artifacts/ || true
          cp ${{ env.OUT_DIR }}/drivers/thermal/qcom/qcom_tsens.ko artifacts/ || true
          cp ${{ env.OUT_DIR }}/drivers/cpufreq/qcom-cpufreq-hw.ko artifacts/ || true
          cp ${{ env.OUT_DIR }}/drivers/clk/qcom/clk-qcom.ko artifacts/ || true
          cp ${{ env.OUT_DIR }}/drivers/soc/qcom/dcvs/qcom-dcvs.ko artifacts/ || true

      - name: Upload artifacts (success)
        if: steps.build.outputs.exit_code == 0
        uses: actions/upload-artifact@v4
        with:
          name: android14-gki-6.1.163-droidspaces
          path: artifacts
